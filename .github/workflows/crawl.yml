name: 更新 FAQ

# 兩種啟動方式：
#   1. Actions 分頁按 Run workflow（可選模式）
#   2. 每天 07:00（臺北）全站重抓一遍 —— 新增、異動、下架一次都抓到
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 抓取模式
        type: choice
        default: 補齊（站上有幾筆就抓到幾筆）
        options:
          - 補齊（站上有幾筆就抓到幾筆）
          - 補齊＋複查 300 筆
          - 全站重抓（約 1.5 小時）
          - 只同步到兩個網站（不抓）
  schedule:
    # 每天 07:00 臺北（＝前一天 23:00 UTC）。GitHub 的排程常延後幾十分鐘到幾小時，
    # 所以這是「最早 7 點開始」，不是準點。
    # 以前是每天 22:00 補齊＋複查、週日 23:00 全站兩班，兩班延後到同一個
    # 時間時，GitHub 只留一班在排隊，全站那班被擠掉過（2026-09-20）。
    - cron: '0 23 * * *'

permissions:
  contents: write

# GitHub 的機器預設是 UTC，不設的話 runs.csv 裡會混著 UTC 和臺北時間，
# 「上次更新 13:48」看起來像是下午跑的，其實是晚上 21:48。
env:
  TZ: Asia/Taipei

concurrency:                  # 兩輪同時跑會互相蓋掉 commit
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 全站用併發 3 約 1.5 小時；官網沒反應時爬蟲最多等 30 分鐘就自己停，
    # 這裡多留餘裕，避免抓到一半被 GitHub 強制中止、連已抓的都存不進去。
    timeout-minutes: 300
    steps:
      # 取「開跑當下」最新的 main，不是「排進佇列那一刻」的版本 ——
      # 排在前一輪後面等的那一輪，不這樣會拿舊資料開跑，存檔時跟前一輪衝突。
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 抓取
        id: run
        run: |
          # 不抓，只把現有資料推到秘密客與 FAQ 搜尋站（在公司想馬上同步、或測權杖時用）
          case "${{ inputs.mode }}" in
            *只同步*)
              echo "只同步，不抓。" | tee run.log
              echo "code=0" >> "$GITHUB_OUTPUT"
              echo "force=1" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # 全站一律用 E（併發 3）：從 GitHub 抓一筆約 1.8 秒，循序要 4 小時以上
          case "${{ inputs.mode }}" in
            *全站*)   ARGS="--full --method E" ;;
            *複查*)   ARGS="--refresh 300" ;;
            *)        ARGS="" ;;
          esac
          # 排程一律全站。官網清單只印發布日期、不印更新時間，既有問答的
          # 「內容被改了」從清單上看不出來，非得逐筆敲內文頁不可 —— 每天全站
          # 就保證最慢一天發現。官網沒反應時的處理跟本機一樣（crawl.py 裡）：
          # 連續 1 分鐘失敗就停 1 分鐘、試 1 分鐘，連續 30 分鐘都失敗就停止。
          if [ -z "${{ inputs.mode }}" ]; then
            ARGS="--full --method E"
            # GitHub 自己的排程是備援：主要由 Cloudflare 準時觸發
            # （cloudflare/trigger-worker.js，走上面的手動模式）。
            # 今天已經有完整跑完的全站重抓，就不再跑第二次。
            # last_full 只有全站「沒被中斷」跑完才會寫，中斷的那輪不算。
            TODAY=$(date '+%Y-%m-%d')
            LAST=$(python -c "import json;print(json.load(open('docs/meta.json',encoding='utf-8')).get('last_full',''))")
            if [ "${LAST:0:10}" = "$TODAY" ]; then
              echo "今天（$TODAY）已經全站重抓過（$LAST），備援排程跳過。" | tee run.log
              echo "code=0" >> "$GITHUB_OUTPUT"
              echo "skip=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "模式參數：${ARGS:-（補齊）}"
          python crawl.py $ARGS 2>&1 | tee run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 把結果寫進執行摘要
        run: |
          {
            echo '## 抓取結果'
            echo '```'
            tail -12 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 爬完就把向量重算，跟 faq.json 一起 commit。不做的話向量會停在舊資料，
      # 網頁比對語料指紋發現對不上，就會把「語意·快」灰掉。
      # 只算 e5-small：向量 3.2 MB、瀏覽器要下載的模型約 113 MB，載得動；
      # e5-large 的模型 2.1 GB，公開頁不可能用，留在本機自己算。
      # 向量照 sid 排序存成 int8，每天 git 只多約 3 MB 以內。
      #
      # continue-on-error 很重要：這一步失敗時，後面的「存檔」一定要照樣跑，
      # 否則前面爬了一個半小時的 faq.json 會整個丟掉。失敗的話 docs/vectors/ 不會被
      # 覆蓋（cp 在算完之後才做），舊向量留著，網頁端指紋對不上就自動停用語意查詢。
      # 「只同步（不抓）」那個模式沒有新資料，不用重算。
      - name: 快取語意模型
        if: steps.run.outputs.code == '0' && steps.run.outputs.skip != '1' && steps.run.outputs.force != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1

      - name: 重算向量
        if: steps.run.outputs.code == '0' && steps.run.outputs.skip != '1' && steps.run.outputs.force != '1'
        continue-on-error: true
        run: |
          # CPU 版的 torch 先裝（預設會抓 GPU 版，約 2 GB，這裡用不到）
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "sentence-transformers>=3" numpy
          python 建立向量.py --model intfloat/multilingual-e5-small --tag e5-small
          mkdir -p docs/vectors
          cp vectors/e5-small.bin  docs/vectors/
          cp vectors/e5-small.json docs/vectors/

      - name: 存檔
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if git diff --cached --quiet; then
            echo '資料沒有變動，不用 commit'
            exit 0
          fi
          N=$(git diff --cached --numstat -- docs/faq.json | awk '{print $1"+/"$2"-"}')
          git commit -m "資料更新 $(date '+%Y-%m-%d %H:%M') ${N}"
          git pull --rebase --autostash
          git push

      # 抓到官網有變動，就接著同步秘密客與 FAQ 搜尋站（以前要回家開本機工作台才會同步）。
      # 需要 repo 的 Secret「SYNC_MYSTERY」：fine-grained 權杖，只選那兩個 repo，
      # Contents: Read and write。沒設定就跳過，不影響爬蟲。
      # 只有順利跑完的那輪才同步（跟本機的「抓完自動同步」一樣），資料不完整不推。
      - name: 同步到兩個網站
        if: steps.run.outputs.code == '0' && steps.run.outputs.skip != '1'
        env:
          SITES_TOKEN: ${{ secrets.SYNC_MYSTERY }}
        run: |
          if [ -z "$SITES_TOKEN" ]; then
            echo '還沒設定 Secret SYNC_MYSTERY，跳過同步'
            exit 0
          fi
          N=$(python -c "import json;m=json.load(open('docs/meta.json',encoding='utf-8'));print(sum(m.get(k) or 0 for k in ('last_new','last_changed','last_gone','last_back')))")
          if [ "${{ steps.run.outputs.force }}" = "1" ]; then
            N="（手動要求）"
          elif [ "$N" = "0" ]; then
            echo '官網這次沒有新增、異動或下架，兩個網站不用同步'
            exit 0
          fi
          echo "官網有 $N 筆變動，同步到兩個網站"
          git config --global user.name  'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for r in 1999-mystery-shopper taipei-faq-search; do
            git config --global url."https://x-access-token:${SITES_TOKEN}@github.com/andy939/$r".insteadOf "https://github.com/andy939/$r"
          done
          python 同步網站.py

      - name: 沒抓完就提醒
        if: steps.run.outputs.code != '0'
        run: echo "::warning::爬蟲回報沒抓完整（可能被限流），詳見上面的執行摘要"
