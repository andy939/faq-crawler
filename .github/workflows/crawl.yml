name: 更新 FAQ

# 三種啟動方式：
#   1. Actions 分頁按 Run workflow（可選模式）
#   2. 每天 22:00（臺北）自動補齊
#   3. 每週日 23:00（臺北）全站重抓一遍，抓舊資料的異動
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 抓取模式
        type: choice
        default: 補齊（站上有幾筆就抓到幾筆）
        options:
          - 補齊（站上有幾筆就抓到幾筆）
          - 補齊＋複查 300 筆
          - 全站重抓（約 50 分鐘）
  schedule:
    - cron: '0 14 * * *'     # 每天 22:00 臺北
    - cron: '0 15 * * 0'     # 每週日 23:00 臺北

permissions:
  contents: write

# GitHub 的機器預設是 UTC，不設的話 runs.csv 裡會混著 UTC 和臺北時間，
# 「上次更新 13:48」看起來像是下午跑的，其實是晚上 21:48。
env:
  TZ: Asia/Taipei

concurrency:                  # 兩輪同時跑會互相蓋掉 commit
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 抓取
        id: run
        run: |
          case "${{ inputs.mode }}" in
            *全站*)   ARGS="--full" ;;
            *複查*)   ARGS="--refresh 300" ;;
            *)        ARGS="" ;;
          esac
          # 排程：週日那班走全站，平日走「補齊＋複查 500 筆」。
          # 為什麼平日要複查：官網清單只印發布日期、不印更新時間，
          # 所以既有問答的「內容被改了」從清單上看不出來，非得去敲內文頁不可。
          # 每天輪 500 筆，約 17 天可以輪完全站；週日的全站重抓則保證
          # 最慢 7 天一定會發現。兩者搭配，改動不會石沉大海。
          if [ -z "${{ inputs.mode }}" ]; then
            if [ "${{ github.event.schedule }}" = "0 15 * * 0" ]; then
              ARGS="--full"
            else
              ARGS="--refresh 500"
            fi
          fi
          echo "模式參數：${ARGS:-（補齊）}"
          python crawl.py $ARGS 2>&1 | tee run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 把結果寫進執行摘要
        run: |
          {
            echo '## 抓取結果'
            echo '```'
            tail -12 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 存檔
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if git diff --cached --quiet; then
            echo '資料沒有變動，不用 commit'
            exit 0
          fi
          N=$(git diff --cached --numstat -- docs/faq.json | awk '{print $1"+/"$2"-"}')
          git commit -m "資料更新 $(date '+%Y-%m-%d %H:%M') ${N}"
          git pull --rebase --autostash
          git push

      - name: 沒抓完就提醒
        if: steps.run.outputs.code != '0'
        run: echo "::warning::爬蟲回報沒抓完整（可能被限流），詳見上面的執行摘要"
